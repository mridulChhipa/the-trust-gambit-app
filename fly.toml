app = "trust-gambit-socket"

primary_region = "sin"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  NODE_ENV = "production"
  SOCKET_PORT = "3001"
  SOCKET_ALLOWED_ORIGINS = "https://the-trust-gambit-app.vercel.app"

[processes]
  app = "node server.js"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 1
  processes = ["app"]
